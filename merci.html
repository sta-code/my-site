<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Merci | Staline Gbedji</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

            font-family:'Segoe UI',sans-serif;

            overflow:hidden;

        }

        .card-thank{

            width:90%;
            max-width:650px;

            background:rgba(255,255,255,.1);

            backdrop-filter:blur(15px);

            border-radius:25px;

            padding:50px;

            text-align:center;

            color:white;

            box-shadow:0 15px 40px rgba(0,0,0,.3);

            animation:zoom .8s ease;

        }

        @keyframes zoom{

            from{

                transform:scale(.5);

                opacity:0;

            }

            to{

                transform:scale(1);

                opacity:1;

            }

        }

        .icon-success{

            font-size:90px;

            color:#22c55e;

            animation:bounce 1.5s infinite;

        }

        @keyframes bounce{

            0%{transform:translateY(0);}

            50%{transform:translateY(-12px);}

            100%{transform:translateY(0);}

        }

        h1{

            margin-top:20px;

            font-weight:bold;

        }

        p{

            margin-top:20px;

            font-size:18px;

            line-height:1.7;

        }

        .btn-home{

            margin-top:35px;

            padding:15px 40px;

            border-radius:50px;

            font-size:18px;

        }

        .footer{

            margin-top:35px;

            font-size:14px;

            opacity:.8;

        }

    </style>

</head>

<body>

<div class="card-thank">

    <i class="bi bi-check-circle-fill icon-success"></i>

    <h1>

        Merci pour votre message !

    </h1>

    <p>

        Votre message a été envoyé avec succès.

        <br><br>

        Je vous remercie de l'intérêt que vous portez à mon profil.

        Je prendrai connaissance de votre message et je vous répondrai dans les meilleurs délais.(par email de préférence)
      

    </p>

    <a href="index.html"
       class="btn btn-success btn-home">

        <i class="bi bi-house-fill"></i>

        Retour à l'accueil

    </a>

    <div class="footer">

        © 2026 - GBEDJI Staline

    </div>

</div>

</body>

</html>
